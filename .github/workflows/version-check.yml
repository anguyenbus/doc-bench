name: Version Alignment Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check version alignment
        run: |
          python -c "
          import sys
          from pathlib import Path
          import yaml
          sys.path.insert(0, 'src')

          from doc_bench.version import get_version, check_dataset_version_alignment

          package_version = get_version()
          print(f'Package version: {package_version}')

          manifest_path = Path('data/MANIFEST.yaml')
          if manifest_path.exists():
              errors = check_dataset_version_alignment(str(manifest_path))
              if errors:
                  print('Version alignment errors:')
                  for error in errors:
                      print(f'  - {error}')
                  sys.exit(1)
              else:
                  print('All dataset versions aligned with package version')
          else:
              print('No MANIFEST.yaml found, skipping check')
          "
