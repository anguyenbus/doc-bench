version: "3.8"

services:
  doc-bench:
    build:
      context: .
      target: runtime
    image: doc-bench:latest
    container_name: doc-bench

    # Volume mounts for I/O
    volumes:
      # Parser modules (read-only) - mount your parser here
      - ./parsers:/work/parsers:ro
      # Evaluation results (read-write) - results written here
      - ./results:/work/results:rw

    # Environment variables
    environment:
      - DOC_BENCH_LOG_LEVEL=${DOC_BENCH_LOG_LEVEL:-INFO}
      - DOC_BENCH_OUTPUT_FORMAT=${DOC_BENCH_OUTPUT_FORMAT:-csv}

    # Restart policy (manual control for development)
    restart: "no"

    # Default command shows help
    command: ["--help"]
