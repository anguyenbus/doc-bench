version: "3.8"

# Development override for docker-compose.yml
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  doc-bench:
    # Override volumes for development (mount source code)
    volumes:
      # Source code for hot reload
      - ./references/eval-harness/src:/opt/doc-bench/src:rw
      # Scripts for development
      - ./references/eval-harness/scripts:/opt/doc-bench/scripts:rw
      # Configs for development
      - ./references/eval-harness/configs:/opt/doc-bench/configs:rw
      # Parser modules (read-only)
      - ./parsers:/work/parsers:ro
      # Evaluation results (read-write)
      - ./results:/work/results:rw

    # Debug logging by default
    environment:
      - DOC_BENCH_LOG_LEVEL=DEBUG

    # Keep container running for development
    command: ["--help"]
