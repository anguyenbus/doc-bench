[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-bench"
version = "0.1.0"
description = "Local evaluation framework for document parsing systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "pandas",
    "pyyaml",
    "jinja2",
    "pypdf",
    "huggingface-hub",
    "Levenshtein",
    # NOTE: rapidfuzz is retained because table_teds.py uses rapidfuzz.distance.Levenshtein
    # for cell content scoring inside CustomConfig.normalized_distance. Porting to the
    # Levenshtein package would require updating the drift guard for table_teds.py
    # (the vendored docling_baseline copy still uses rapidfuzz). Deferred to the next
    # upstream sync when table_teds.py can be updated on both sides simultaneously.
    "rapidfuzz>=3",
    "apted>=1",
    "beautifulsoup4>=4",
    "lxml>=5",
    "beartype",
    "polars>=1.41.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.0.0",
]
docling = [
    "docling>=2",
]

[project.scripts]
doc-bench = "doc_bench.runners.run_parsing_eval:main"
doc-bench-dump-dataset = "doc_bench.cli.dump_dataset:main"
doc-bench-download = "doc_bench.cli.download:main"
doc-bench-list-datasets = "doc_bench.cli.list_datasets:main"
doc-bench-smoke-test = "doc_bench.cli.smoke_test:main"
doc-bench-setup = "doc_bench.cli.setup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_bench"]

# NOTE: fixtures and MANIFEST.yaml ship as package data inside doc_bench/ via the
# include globs below. We deliberately do NOT add a
# [tool.hatch.build.targets.wheel.shared-data] mapping for them: that packages a
# second copy under doc_bench-<ver>.data/data/. The code reads them from the package
# (importlib.resources / files("doc_bench")), so the in-package copy is canonical.
[tool.hatch.build]
include = [
    "src/doc_bench/**/*.py",
    "src/doc_bench/fixtures/**/*",
    "src/doc_bench/MANIFEST.yaml",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.8",
    "black>=24",
    "mypy>=1",
    "types-pyyaml",
    "types-jsonschema",
]
# NOTE: Dev-only generator group for the vendored docling-baseline fixture
# generator (src/docling_baseline). These deps are heavy (docling pulls a torch
# tree) and are intentionally confined here: they NEVER appear in
# [project.dependencies] nor in the [docling] runtime extra. A no-group
# `uv sync` must not install docling/docling-core. Authoritative dep list comes
# from @references/docling-baseline/pyproject.toml. Invoked via
# `uv run --python 3.13 --group generator` (see `make regen-fixtures`); the
# generator assumes Python 3.13 while doc-bench core stays requires-python >=3.12.
generator = [
    "docling>=2",
    "docling-core",
    "apted>=1",
    # NOTE: rapidfuzz is required by the vendored docling_baseline fixture generator
    # (src/docling_baseline/metrics/table_teds.py, mhs.py, nid.py, text_similarity.py).
    # The generator code is frozen third-party vendored code and cannot be updated here.
    "rapidfuzz>=3",
    "beautifulsoup4>=4",
    "lxml>=5",
    # NOTE: nltk and sacrebleu are required by the vendored docling_baseline generator
    # (src/docling_baseline/metrics/text_similarity.py) which is frozen third-party code.
    # The generator's base.py runner calls bleu_score and meteor_score from text_similarity.
    # These packages are NOT in [project.dependencies] (doc-bench itself no longer needs
    # BLEU or METEOR — those metrics were removed in the 2026-06-07 NED simplification spec),
    # but the frozen generator still requires them for make regen-fixtures.
    "nltk",
    "sacrebleu>=2.6.0",
    "jsonschema>=4",
    "polars>=1.41.0",
    "click>=8.0.0",
    "pydantic>=2",
    "beartype",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# NOTE: src/docling_baseline is a verbatim vendored third-party generator and is
# intentionally exempt from doc-bench lint standards (see spec FR1/AC1).
# force-exclude keeps the vendored tree quiet even when ruff is handed an
# explicit path (e.g. pre-commit), not just on a `ruff check .` directory scan.
# NOTE: references/omnidocbench is an audit trail copy of the OmniDocBench
# source files (Apache-2.0) and is intentionally exempt from lint standards.
# NOTE: notebooks/ holds exploratory .ipynb cells; linting notebook cells is
# low-value and intentionally exempt from doc-bench lint standards.
extend-exclude = ["src/docling_baseline", "references/omnidocbench", "notebooks"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D212", "D200", "B904", "B007", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # Allow docstring issues in tests
"src/doc_bench/runners/run_parsing_eval.py" = ["E501"]  # Long format strings
"src/doc_bench/identity.py" = ["E501"]  # Long docstring lines
"src/doc_bench/rejections.py" = ["E501"]  # Long docstring lines
"src/doc_bench/cli/__init__.py" = ["F401"]  # Unused os import for future use
"src/doc_bench/metrics/parsing/__init__.py" = ["F401"]  # Conditional imports

[tool.black]
line-length = 100
target-version = ["py313"]
# NOTE: src/docling_baseline is a verbatim vendored third-party generator and is
# intentionally exempt from doc-bench formatting (see spec FR1/AC1). black's
# extend-exclude is a regex applied to paths; without this, `black --check .`
# (run by `make lint` / CI) would scan the vendored tree and fail.
# NOTE: references/omnidocbench is an audit trail copy (Apache-2.0) exempt from formatting.
extend-exclude = "src/docling_baseline|references/omnidocbench|notebooks"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# NOTE: src/docling_baseline is a verbatim vendored third-party generator and is
# intentionally exempt from doc-bench type checking (see spec FR1/AC1).
# NOTE: references/omnidocbench is an audit trail copy (Apache-2.0) exempt from type checking.
exclude = ["src/docling_baseline", "references/omnidocbench"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "docling_baseline.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
# NOTE: `-m "not build"` deselects the slow wheel-build leak guard from the
# default fast loop (`uv run pytest` / `pytest -q`). The existing `slow` marker
# is intentionally NOT deselected here: it is already used by integration tests
# that are expected to run by default, so a dedicated `build` marker isolates
# the wheel-build guard without changing `slow` behavior. Select the guard
# explicitly with `uv run pytest -m build` (see the CI `ci` target / Makefile).
addopts = '-v --tb=short -m "not build"'
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "build: marks the wheel-build leak guard; deselected by default, run with '-m build'",
]

[tool.coverage.run]
source = ["src"]
branch = true
# NOTE: src/docling_baseline is a verbatim vendored third-party generator and is
# intentionally exempt from doc-bench coverage targets (see spec FR1/AC1).
# NOTE: references/omnidocbench is an audit trail copy (Apache-2.0) exempt from coverage.
omit = ["src/docling_baseline/*", "references/omnidocbench/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
